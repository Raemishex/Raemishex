<svg width="1180" height="360" viewBox="0 0 1180 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .swiss-headline-l {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .swiss-mono-l {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      .swiss-text-l {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
      }

      @keyframes isometricFloatL {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      @keyframes redPulseL {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.15); }
      }

      .iso-drawing-l {
        transform-origin: 900px 180px;
        animation: isometricFloatL 6s ease-in-out infinite;
      }

      .accent-dot-l {
        transform-origin: center;
        animation: redPulseL 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Surface (Pure Pristine Paper) -->
  <rect width="1180" height="360" rx="12" fill="#fafafa"/>
  <rect x="0.5" y="0.5" width="1179" height="359" rx="11.5" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Structural Swiss Grid Guidelines -->
  <g stroke="#f4f4f5" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="680" y1="0" x2="680" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="64" x2="1180" y2="64"/>
    <line x1="0" y1="300" x2="1180" y2="300"/>
  </g>

  <!-- Technical Corner Ticks -->
  <g stroke="#a1a1aa" stroke-width="1">
    <line x1="16" y1="12" x2="16" y2="20"/>
    <line x1="12" y1="16" x2="20" y2="16"/>
    <line x1="1164" y1="12" x2="1164" y2="20"/>
    <line x1="1160" y1="16" x2="1168" y2="16"/>
    <line x1="16" y1="340" x2="16" y2="348"/>
    <line x1="12" y1="344" x2="20" y2="344"/>
    <line x1="1164" y1="340" x2="1164" y2="348"/>
    <line x1="1160" y1="344" x2="1168" y2="344"/>
  </g>

  <!-- Top Header Metadata -->
  <g class="swiss-mono-l" font-size="11" fill="#71717a">
    <text x="80" y="44">01 // IDENTITY</text>
    <text x="680" y="44">SYSTEM ARCHITECTURE &amp; 3D ENGINE</text>
    <circle cx="1080" cy="40" r="3" fill="#e11d48"/>
    <text x="1090" y="44" fill="#09090b" font-weight="600">ACTIVE</text>
  </g>

  <!-- ==================== LEFT SECTION: TYPOGRAPHY HIERARCHY ==================== -->
  <g transform="translate(80, 105)">
    <text x="0" y="54" class="swiss-headline-l" font-size="64" font-weight="900" fill="#09090b">
      RAEMISHEX
    </text>

    <!-- Swiss Solid Red Accent Bar -->
    <rect x="0" y="78" width="56" height="3" fill="#e11d48"/>

    <text x="0" y="112" class="swiss-text-l" font-size="16" font-weight="700" fill="#18181b" letter-spacing="-0.01em">
      Full-Stack Systems, Real-Time Graphics &amp; Audio DSP
    </text>

    <text x="0" y="142" class="swiss-text-l" font-size="13" font-weight="400" fill="#52525b" line-height="1.4">
      Designing minimalist interactive web software, mathematical sound synthesis, and C# / 3D runtimes.
    </text>

    <g transform="translate(0, 172)" class="swiss-mono-l" font-size="11">
      <text x="0" y="0" fill="#71717a">FOCUS // <tspan fill="#09090b" font-weight="600">THREE.JS • ASP.NET CORE • WEB AUDIO</tspan></text>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: ARCHITECTURAL 3D ISOMETRIC SCHEMATIC ==================== -->
  <g class="iso-drawing-l">
    <g stroke="#e4e4e7" stroke-width="1" stroke-dasharray="2 3">
      <line x1="890" y1="180" x2="770" y2="250"/>
      <line x1="890" y1="180" x2="1010" y2="250"/>
      <line x1="890" y1="180" x2="890" y2="80"/>
    </g>

    <!-- Precision Isometric Polyhedron -->
    <polygon points="890,95 970,140 890,185 810,140" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.2"/>
    <polygon points="810,140 890,185 890,270 810,225" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="1.2"/>
    <polygon points="890,185 970,140 970,225 890,270" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="1.2"/>

    <!-- Inner Geometry Line -->
    <line x1="810" y1="140" x2="970" y2="225" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="970" y1="140" x2="810" y2="225" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Single Bold Focal Point: Swiss Vermilion Vertex Anchor -->
    <circle cx="890" cy="185" r="4.5" fill="#e11d48" class="accent-dot-l"/>
    <circle cx="890" cy="185" r="1.5" fill="#ffffff"/>

    <circle cx="890" cy="95" r="2.5" fill="#52525b"/>
    <circle cx="970" cy="140" r="2.5" fill="#52525b"/>
    <circle cx="970" cy="225" r="2.5" fill="#52525b"/>
    <circle cx="890" cy="270" r="2.5" fill="#52525b"/>
    <circle cx="810" cy="225" r="2.5" fill="#52525b"/>
    <circle cx="810" cy="140" r="2.5" fill="#52525b"/>

    <g class="swiss-mono-l" font-size="9" fill="#71717a">
      <text x="890" y="295" text-anchor="middle">ISOMETRIC PROJECTION [1:1]</text>
      <text x="982" y="142">X+1</text>
      <text x="798" y="142" text-anchor="end">Y+1</text>
      <text x="890" y="85" text-anchor="middle">Z+1</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SYSTEM FOOTER ==================== -->
  <g class="swiss-mono-l" font-size="10" fill="#71717a">
    <text x="80" y="325">PLATFORM: OPEN WEB &amp; NATIVE RUNTIMES</text>
    <text x="680" y="325">BAKU, AZ // 40.4093° N, 49.8671° E</text>
    <text x="1100" y="325" text-anchor="end" fill="#52525b">FIG. 2026</text>
  </g>
</svg>