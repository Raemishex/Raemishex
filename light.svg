<svg width="1180" height="380" viewBox="0 0 1180 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chassis-light" x1="0" y1="0" x2="1180" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Laser Scanning Beam -->
    <linearGradient id="laser-beam-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <style>
      @keyframes wireframeFloatL {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(1.2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes pulseNodeL {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.35); opacity: 1; }
      }

      @keyframes cursorBlinkL {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .wireframe-mesh-l {
        transform-origin: 900px 200px;
        animation: wireframeFloatL 7.5s ease-in-out infinite;
      }

      .node-pulse-l {
        transform-origin: center;
        animation: pulseNodeL 3s ease-in-out infinite;
      }

      .cursor-l {
        animation: cursorBlinkL 0.9s infinite;
      }

      .tech-mono {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }

      .tech-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Chassis -->
  <rect width="1180" height="380" rx="16" fill="url(#chassis-light)"/>
  <rect x="0.5" y="0.5" width="1179" height="379" rx="15.5" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Subtle Blueprint Dot Grid -->
  <g opacity="0.38">
    <pattern id="dot-grid-l" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1"/>
    </pattern>
    <rect x="20" y="20" width="1140" height="340" fill="url(#dot-grid-l)"/>
  </g>

  <!-- Precision Technical Registration Marks -->
  <g stroke="#94a3b8" stroke-width="1.2" opacity="0.7">
    <line x1="28" y1="22" x2="28" y2="34"/>
    <line x1="22" y1="28" x2="34" y2="28"/>
    <line x1="1152" y1="22" x2="1152" y2="34"/>
    <line x1="1146" y1="28" x2="1158" y2="28"/>
    <line x1="28" y1="346" x2="28" y2="358"/>
    <line x1="22" y1="352" x2="34" y2="352"/>
    <line x1="1152" y1="346" x2="1152" y2="358"/>
    <line x1="1146" y1="352" x2="1158" y2="352"/>
  </g>

  <!-- Top Telemetry Ribbon -->
  <g class="tech-mono" font-size="10" fill="#64748b" letter-spacing="1">
    <text x="50" y="55">SYS // RAEMISHEX.KERNEL</text>
    <text x="310" y="55" fill="#cbd5e1">|</text>
    <text x="335" y="55">ARCH // REAL-TIME &amp; 3D</text>
    <text x="560" y="55" fill="#cbd5e1">|</text>
    <circle cx="590" cy="51" r="3" fill="#059669"/>
    <text x="602" y="55" fill="#059669" font-weight="600">ONLINE</text>
    <text x="1130" y="55" text-anchor="end" fill="#64748b">SPEC // v4.2</text>
  </g>

  <!-- Divider Rule with Accent Notch -->
  <line x1="50" y1="72" x2="1130" y2="72" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="50" y1="72" x2="135" y2="72" stroke="#d97706" stroke-width="2"/>

  <!-- ==================== LEFT COLUMN: TYPOGRAPHY & IDENTITY ==================== -->
  <g transform="translate(50, 115)">
    <!-- Primary Nameplate -->
    <text x="0" y="50" class="tech-sans" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-0.03em">
      RAEMISHEX
    </text>

    <!-- Typing Animation Subtitle -->
    <g transform="translate(0, 88)">
      <rect x="0" y="-15" width="3" height="22" fill="#0284c7"/>
      
      <!-- Role 1 -->
      <clipPath id="light-role-0">
        <rect x="14" y="-16" width="0" height="26">
          <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.1330;0.3000;0.3010;1.0000" values="0;272;272;0;0"/>
        </rect>
      </clipPath>
      <text x="14" y="2" class="tech-mono" font-size="14.5" font-weight="700" fill="#1e293b" letter-spacing="0.04em" textLength="268" lengthAdjust="spacing" clip-path="url(#light-role-0)">
        REAL-TIME SYSTEMS &amp; 3D GRAPHICS
      </text>

      <!-- Role 2 -->
      <clipPath id="light-role-1">
        <rect x="14" y="-16" width="0" height="26">
          <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.4663;0.6333;0.6343;1.0000" values="0;0;235;235;0;0"/>
        </rect>
      </clipPath>
      <text x="14" y="2" class="tech-mono" font-size="14.5" font-weight="700" fill="#d97706" letter-spacing="0.04em" textLength="232" lengthAdjust="spacing" clip-path="url(#light-role-1)">
        INTERACTIVE WEB AUDIO &amp; DSP
      </text>

      <!-- Role 3 -->
      <clipPath id="light-role-2">
        <rect x="14" y="-16" width="0" height="26">
          <animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.7997;0.9667;0.9677;1.0000" values="0;0;260;260;0;0"/>
        </rect>
      </clipPath>
      <text x="14" y="2" class="tech-mono" font-size="14.5" font-weight="700" fill="#0284c7" letter-spacing="0.04em" textLength="256" lengthAdjust="spacing" clip-path="url(#light-role-2)">
        FULL-STACK APPS &amp; CREATIVE DEV
      </text>

      <!-- Animated Typing Cursor -->
      <rect x="14" y="-13" width="7" height="18" fill="#0284c7" class="cursor-l">
        <animate attributeName="x" dur="12s" repeatCount="indefinite" 
                 keyTimes="0.0000;0.1330;0.3000;0.3010;0.3333;0.4663;0.6333;0.6343;0.6667;0.7997;0.9667;0.9677;1.0000" 
                 values="14;284;284;14;14;248;248;14;14;272;272;14;14"/>
      </rect>
    </g>

    <!-- Scope / Statement -->
    <text x="0" y="132" class="tech-sans" font-size="13.5" font-weight="400" fill="#475569" letter-spacing="0.01em">
      Crafting interactive 3D web experiences, zero-dependency tools, and low-latency systems.
    </text>

    <!-- Engineering Specs Matrix -->
    <g transform="translate(0, 175)" class="tech-mono" font-size="11">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="130" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="17" fill="#64748b">ENGINE:</text>
        <text x="68" y="17" fill="#0284c7" font-weight="700">WebGL / 3D</text>
      </g>

      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="130" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="17" fill="#64748b">AUDIO:</text>
        <text x="64" y="17" fill="#d97706" font-weight="700">Web DSP</text>
      </g>

      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="130" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="12" y="17" fill="#64748b">RUNTIME:</text>
        <text x="76" y="17" fill="#059669" font-weight="700">C# / TS</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: 3D ISOMETRIC WIREFRAME SCHEMATIC ==================== -->
  <g class="wireframe-mesh-l">
    <!-- Spatial Coordinate Axes -->
    <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4">
      <line x1="900" y1="205" x2="740" y2="295"/>
      <line x1="900" y1="205" x2="1060" y2="295"/>
      <line x1="900" y1="205" x2="900" y2="85"/>
    </g>

    <!-- Outer Coordinate Reticle Circle -->
    <circle cx="900" cy="205" r="115" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 8" fill="none"/>
    <circle cx="900" cy="205" r="85" stroke="#cbd5e1" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- 3D Geometric Polyhedral Prism Structure (Isometric) -->
    <polygon points="900,105 990,155 990,255 900,305 810,255 810,155" 
             fill="#f8fafc" fill-opacity="0.8" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Dynamic Depth Facet Triangles -->
    <polygon points="900,105 990,155 900,205" fill="#0284c7" fill-opacity="0.06" stroke="#0284c7" stroke-width="1"/>
    <polygon points="990,155 990,255 900,205" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-width="1"/>
    <polygon points="990,255 900,305 900,205" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-width="1"/>
    <polygon points="900,305 810,255 900,205" fill="#059669" fill-opacity="0.06" stroke="#059669" stroke-width="1"/>
    <polygon points="810,255 810,155 900,205" fill="#0284c7" fill-opacity="0.06" stroke="#0284c7" stroke-width="1"/>
    <polygon points="810,155 900,105 900,205" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-width="1"/>

    <!-- Internal Core Polyhedron -->
    <polygon points="900,150 945,175 945,235 900,260 855,235 855,175" 
             fill="#f1f5f9" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Central Precision Core Point -->
    <circle cx="900" cy="205" r="4" fill="#0284c7"/>
    <circle cx="900" cy="205" r="1.5" fill="#ffffff"/>

    <!-- Precision Laser Sweep Line -->
    <g transform="translate(800, 100)">
      <line x1="0" y1="0" x2="200" y2="0" stroke="url(#laser-beam-light)" stroke-width="1.2" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,210; 0,0" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Node Vertices -->
    <circle cx="900" cy="105" r="3" fill="#d97706" class="node-pulse-l"/>
    <circle cx="990" cy="155" r="2.5" fill="#0284c7"/>
    <circle cx="990" cy="255" r="2.5" fill="#0284c7"/>
    <circle cx="900" cy="305" r="3" fill="#059669"/>
    <circle cx="810" cy="255" r="2.5" fill="#0284c7"/>
    <circle cx="810" cy="155" r="2.5" fill="#0284c7"/>

    <!-- Coordinate HUD Floating Callouts -->
    <g class="tech-mono" font-size="9" fill="#64748b">
      <text x="1005" y="152">[X: +1.00]</text>
      <text x="1005" y="260">[Y: -0.85]</text>
      <text x="745" y="152">[Z: +0.72]</text>
      <text x="900" y="325" text-anchor="middle" fill="#64748b">ISOMETRIC_MESH // 60_FPS</text>
    </g>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g class="tech-mono" font-size="9" fill="#94a3b8">
    <text x="50" y="352">LATENCY: &lt;1.2MS</text>
    <text x="160" y="352">•</text>
    <text x="180" y="352">PIPELINE: TS / C# / THREE.JS</text>
    <text x="375" y="352">•</text>
    <text x="395" y="352">STANDALONE ARCHITECTURE</text>
    <text x="1130" y="352" text-anchor="end" fill="#64748b">AUTH // VERIFIED</text>
  </g>
</svg>